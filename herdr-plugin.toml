id = "wxomi.session-titles"
name = "Session Titles"
version = "0.5.1"
min_herdr_version = "0.8.0"
description = "Real agent session titles + paired <workspace>-agents + recency-based similar agent grouping"
platforms = ["linux", "macos"]

# Background refresh so titles stay current as sessions rename themselves.
[[startup]]
command = ["python3", "-m", "session_titles", "--watch"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-m", "session_titles"]

[[events]]
on = "tab.focused"
command = ["python3", "-m", "session_titles"]

[[events]]
on = "tab.renamed"
command = ["python3", "-m", "session_titles"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-m", "session_titles"]
